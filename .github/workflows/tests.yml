name: PyTestxdist Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --alluredir=allure-results --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: allure-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: allure-results/
        retention-days: 30

    - name: Upload pytest cache
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: pytest-cache-${{ matrix.os }}-py${{ matrix.python-version }}
        path: .pytest_cache/
        retention-days: 7

    - name: Comment PR with results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const allureDir = './allure-results';
          const files = fs.readdirSync(allureDir).filter(f => f.endsWith('-result.json'));
          const totalTests = files.length;
          const status = '${{ job.status }}';
          
          const comment = `## Test Results for Python ${{ matrix.python-version }} on ${{ matrix.os }}
          - Status: ${status}
          - Tests: ${totalTests}
          - [View Allure Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  coverage:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest-cov

    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=pages --cov=utils --cov-report=xml --cov-report=html --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint flake8 black

    - name: Run Black formatter check
      run: black --check tests/ pages/ utils/ || true

    - name: Run Flake8 linter
      run: flake8 tests/ pages/ utils/ --max-line-length=120 --extend-ignore=E203,W503 || true

    - name: Run Pylint
      run: pylint tests/ pages/ utils/ --fail-under=7.0 || true

  notify:
    runs-on: ubuntu-latest
    needs: [test, coverage, lint]
    if: failure()

    steps:
    - name: Send Slack notification
      if: vars.SLACK_WEBHOOK != ''
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'PyTestxdist Tests Failed'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
